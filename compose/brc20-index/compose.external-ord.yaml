services:
  brc20-db:
    container_name: brc20-bestinslot-db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BRC20_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BRC20_DB_PASSWD:?set BRC20_DB_PASSWD}
      POSTGRES_DB: ${BRC20_DB_DATABASE:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - /var/lib/brc20-bestinslot/postgres:/var/lib/postgresql/data

  brc20-prog:
    container_name: brc20-prog-bestinslot
    image: ghcr.io/bitcreditprotocol/brc20-prog-bestinslot:${BRC20_PROG_VERSION:?set BRC20_PROG_VERSION}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      BRC20_PROG_RPC_SERVER_URL: 0.0.0.0:18545
      BRC20_PROG_RPC_SERVER_ENABLE_AUTH: "false"
      BRC20_PROG_RPC_SERVER_USER: ""
      BRC20_PROG_RPC_SERVER_PASSWORD: ""
      BRC20_PROG_DB_PATH: /var/lib/brc20-prog/data
      BITCOIN_RPC_NETWORK: mainnet
      BITCOIN_RPC_USER: ${BTC_RPC_USER:?set BTC_RPC_USER}
      BITCOIN_RPC_PASSWORD: ${BTC_RPC_PASSWORD:?set BTC_RPC_PASSWORD}
      EVM_RECORD_TRACES: "true"
      BRC20_PROG_BALANCE_SERVER_URL: http://brc20-index-bestinslot:18546
      BITCOIN_RPC_URL: http://brc20-index-bestinslot:18547
    expose:
      - "18545"
    volumes:
      - /var/lib/brc20-bestinslot/prog:/var/lib/brc20-prog/data

  brc20-index-bestinslot:
    container_name: brc20-index-bestinslot
    image: ghcr.io/bitcreditprotocol/brc20-index-bestinslot:${BRC20_INDEX_VERSION:?set BRC20_INDEX_VERSION}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      brc20-db:
        condition: service_healthy
      brc20-prog:
        condition: service_started
    environment:
      OPERATION_MODE: full
      OPI_DB_URL: ${OPI_DB_URL:?set OPI_DB_URL}
      NETWORK_TYPE: mainnet
      DB_HOST: brc20-db
      DB_PORT: "5432"
      DB_USER: ${BRC20_DB_USER:-postgres}
      DB_PASSWD: ${BRC20_DB_PASSWD:?set BRC20_DB_PASSWD}
      DB_DATABASE: ${BRC20_DB_DATABASE:-postgres}
      DB_SSL: "false"
      REPORT_TO_INDEXER: "false"
      SAVE_LOGS: "false"
      BRC20_PROG_ENABLED: "true"
      BRC20_PROG_RPC_URL: http://brc20-prog:18545
      BRC20_PROG_RPC_USER: ""
      BRC20_PROG_RPC_PASSWORD: ""
      BITCOIN_RPC_CACHE_ENABLED: "false"
      BITCOIN_RPC_PROXY_SERVER_ENABLED: "true"
      BITCOIN_RPC_PROXY_SERVER_ADDR: 0.0.0.0:18547
      BITCOIN_RPC_URL: ${BTC_RPC_URL:?set BTC_RPC_URL}
      BRC20_PROG_BALANCE_SERVER_ADDR: 0.0.0.0:18546
      STARTUP_WAIT_SECONDS: "10"
    expose:
      - "18546"
      - "18547"
    command: ["-l", "info"]

  brc20-api-bestinslot:
    container_name: brc20-api-bestinslot
    image: ghcr.io/bitcreditprotocol/brc20-api-bestinslot:${BRC20_API_VERSION:?set BRC20_API_VERSION}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      brc20-db:
        condition: service_healthy
    environment:
      DB_HOST: brc20-db
      DB_PORT: "5432"
      DB_USER: ${BRC20_DB_USER:-postgres}
      DB_PASSWD: ${BRC20_DB_PASSWD:?set BRC20_DB_PASSWD}
      DB_DATABASE: ${BRC20_DB_DATABASE:-postgres}
      DB_SSL: "false"
      DB_MAX_CONNECTIONS: "10"
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_TRUSTED_PROXY_CNT: ${BRC20_API_TRUSTED_PROXY_CNT:-0}
      RATE_LIMIT_ENABLE: "true"
      RATE_LIMIT_WINDOW_MS: "1000"
      RATE_LIMIT_MAX: "100"
    ports:
      - "${BRC20_API_BIND:-127.0.0.1}:${BRC20_API_PORT:-8000}:8000"
