services:
  bitcoin:
    ports:
      - "18332:18332"   # RPC
      - "18333:18333"   # P2P
    command:
      - "-testnet=1"
      - "-server=1"
      - "-rpcbind=0.0.0.0:18332"
      - "-rpcallowip=0.0.0.0/0"
      - "-rpcuser=${RPCUSER:-devnet}"
      - "-rpcpassword=${RPCPASSWORD:-devnet}"
      - "-fallbackfee=${FALLBACKFEE:-0.0002}"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/18332 && echo > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  electrs:
    command:
      - -vvvv
      - --timestamp
      - --network=testnet
      - --db-dir=/data
      - --daemon-dir=/bitcoin
      - --daemon-rpc-addr=bitcoin:18332
      - --cookie=${RPCUSER:-devnet}:${RPCPASSWORD:-devnet}
      #- --cookie=/bitcoin/testnet/.cookie
      - --electrum-rpc-addr=0.0.0.0:50001
      - --http-addr=0.0.0.0:3000
      - --electrum-txs-limit=1000000
      - --utxos-limit=1000000
      - --cors=*
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/blocks/tip/hash"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  esplora:
    command:
      - "/srv/explorer/run.sh"
      - "bitcoin-testnet"
      - "explorer"