name: docker-ci

on:
  push:
    branches: [ master ]
    paths:
      - 'docker/**'
  pull_request:
    paths:
      - 'docker/**'
  workflow_dispatch:
    inputs:
      app:
        description: 'docker/<app> to build'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write


concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  detect:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_apps: ${{ steps.set-matrix.outputs.has_apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          
          get_apps_from_diff() {
            local base
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
            else
              base="HEAD~1"
            fi
            base=$(git merge-base "$base" HEAD)
            git -c core.pager=cat diff --name-only "$base"...HEAD \
              | sed -n 's#^docker/\([^/][^/]*\)/.*#\1#p' \
              | awk 'NF' \
              | LC_ALL=C sort -u
          }
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SEL="${{ github.event.inputs.app }}"
            if [ -n "$SEL" ]; then
              mapfile -t APPS < <(printf '%s\n' "$SEL" | tr ', ' '\n' | awk 'NF' | LC_ALL=C sort -u)
            else
              mapfile -t APPS < <(ls -1 docker 2>/dev/null || true)
            fi
          else
            mapfile -t APPS < <(get_apps_from_diff)
          fi
          
          # Keep only dirs that have a Dockerfile
          FILTERED=()
          for d in "${APPS[@]}"; do
            [[ -n "$d" && -f "docker/$d/Dockerfile" ]] && FILTERED+=("$d")
          done
          
          if [ "${#FILTERED[@]}" -eq 0 ]; then
            {
              echo 'matrix={"app":[]}'
              echo 'has_apps=false'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Build matrix JSON
          printf '%s\0' "${FILTERED[@]}" \
            | jq -R -s -c 'split("\u0000")[:-1] | {app: .}' \
            | { read -r MATRIX; echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"; }
          
          echo 'has_apps=true' >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.has_apps == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert matrix.app not empty
        run: |
          test -n "${{ matrix.app }}" || { echo "empty matrix.app"; exit 1; }
          echo "Building app=${{ matrix.app }}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ env.OWNER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get VERSION from file
        id: version
        shell: bash
        run: |
          V=""
          [ -f "docker/${{ matrix.app }}/VERSION" ] && V=$(tr -d '\n' < "docker/${{ matrix.app }}/VERSION")
          echo "value=$V" >> "$GITHUB_OUTPUT"
      
      - name: docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.app }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref == 'refs/heads/master' && steps.version.outputs.value != '' }}
            type=raw,value=${{ steps.version.outputs.value }}-${{ github.sha }},enable=${{ github.ref == 'refs/heads/master' && steps.version.outputs.value != '' }}

      - name: build and push
        id: build_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker/${{ matrix.app }}
          file: ./docker/${{ matrix.app }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          provenance: true
          platforms: linux/amd64
